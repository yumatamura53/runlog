<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunLog">
<title>RunLog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- 計測 -->
  <section id="view-run" class="view active">
    <div id="map-run" class="map"></div>
    <div class="gps" id="gps-status"><span class="dot"></span><span id="gps-text">GPS 未取得</span></div>

    <div class="metrics">
      <div class="metric main">
        <div class="value" id="m-distance">0.00</div>
        <div class="label">km</div>
      </div>
      <div class="metric">
        <div class="value" id="m-time">0:00</div>
        <div class="label">タイム</div>
      </div>
      <div class="metric">
        <div class="value" id="m-pace">--'--"</div>
        <div class="label">現在ペース /km</div>
      </div>
      <div class="metric">
        <div class="value" id="m-avg">--'--"</div>
        <div class="label">平均ペース /km</div>
      </div>
      <div class="metric">
        <div class="value" id="m-lap">--'--"</div>
        <div class="label">前の1kmラップ</div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-start" class="btn btn-primary btn-xl">スタート</button>
      <button id="btn-pause" class="btn btn-warn btn-xl" hidden>一時停止</button>
      <button id="btn-resume" class="btn btn-primary btn-lg" hidden>再開</button>
      <button id="btn-finish" class="btn btn-danger btn-lg" hidden>長押しで終了</button>
    </div>
    <p class="hint" id="run-hint">計測中は画面をつけたままにしてください（自動でスリープを防ぎます）</p>
  </section>

  <!-- 履歴 -->
  <section id="view-history" class="view">
    <h1>記録</h1>
    <div class="stats">
      <div class="stat"><div class="stat-v" id="s-week">0.0</div><div class="stat-l">今週 km</div></div>
      <div class="stat"><div class="stat-v" id="s-month">0.0</div><div class="stat-l">今月 km</div></div>
      <div class="stat"><div class="stat-v" id="s-total">0</div><div class="stat-l">総ラン数</div></div>
    </div>
    <ul id="run-list" class="run-list"></ul>
    <p id="empty" class="empty">まだ記録がありません。最初のランに出かけましょう！</p>
  </section>

  <!-- 詳細 -->
  <section id="view-detail" class="view">
    <div class="detail-head">
      <button class="btn btn-ghost" id="btn-back">‹ 戻る</button>
      <div id="d-date" class="detail-date"></div>
    </div>
    <div id="map-detail" class="map map-detail"></div>
    <div class="metrics compact">
      <div class="metric"><div class="value" id="d-distance"></div><div class="label">km</div></div>
      <div class="metric"><div class="value" id="d-time"></div><div class="label">タイム</div></div>
      <div class="metric"><div class="value" id="d-pace"></div><div class="label">平均ペース /km</div></div>
    </div>
    <label class="memo-label">メモ
      <textarea id="d-memo" rows="2" placeholder="体調・コース・天気など"></textarea>
    </label>
    <h2>ラップ</h2>
    <table class="splits"><thead><tr><th>km</th><th>ラップ</th><th></th></tr></thead><tbody id="d-splits"></tbody></table>
    <div class="detail-actions">
      <button class="btn btn-secondary" id="btn-gpx">GPXで書き出し</button>
      <button class="btn btn-ghost danger-text" id="btn-delete">この記録を削除</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="view-run">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>計測</button>
  <button class="tab" data-view="view-history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>記録</button>
  <button class="tab" id="btn-settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>設定</button>
</nav>

<dialog id="settings">
  <form method="dialog">
    <h2>設定</h2>
    <label class="row"><input type="checkbox" id="opt-voice"> 1kmごとに音声でお知らせ</label>
    <label class="row"><input type="checkbox" id="opt-autopause"> 止まったら自動で一時停止</label>
    <label class="row"><input type="checkbox" id="opt-map"> 計測画面に地図を表示</label>
    <button class="btn btn-primary" value="close">閉じる</button>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
